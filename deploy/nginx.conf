server {
    listen 10443 ssl;
    listen [::]:10443 ssl;
    server_name www.engineer-service-report.top;

    ssl_certificate /etc/letsencrypt/live/engineer-service-report.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/engineer-service-report.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 10443;
        proxy_cookie_flags spt_sid secure;
    }
}
